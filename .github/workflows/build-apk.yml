name: Build and Publish Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify active Java version
        run: java -version

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="v1.0.0-build.${{ github.run_number }}.${{ github.run_attempt }}"
          RELEASE_TITLE="Android Debug APK (Build #${{ github.run_number }}.${{ github.run_attempt }})"
          
          RELEASE_NOTES="### Smart Kharcha Android Debug APK
          - **Source Commit**: \`${{ github.sha }}\`
          - **Build Run**: #${{ github.run_number }} (Attempt #${{ github.run_attempt }})
          - **Notice**: This APK is intended for testing and verification only.
          - **Notice**: This APK is not a Play Store production release.
          - **Notice**: This APK is signed only with a temporary debug keystore."

          gh release create "$TAG_NAME" \
            app/build/outputs/apk/debug/app-debug.apk \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --target "${{ github.sha }}" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="v1.0.0-build.${{ github.run_number }}.${{ github.run_attempt }}"
          RELEASE_TITLE="Android Debug APK (Build #${{ github.run_number }}.${{ github.run_attempt }})"

          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            echo "Confirming release using gh release view..."
            gh release view "$TAG_NAME"
            echo "Release tag: $TAG_NAME"
            echo "Release title: $RELEASE_TITLE"
            RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${TAG_NAME}"
            echo "Direct GitHub Release page URL: $RELEASE_URL"
            echo "Exact APK asset filename: app-debug.apk"

            cat << EOF >> "$GITHUB_STEP_SUMMARY"
          ### Android Debug APK Release Succeeded
          - **Release Tag**: \`$TAG_NAME\`
          - **Release Title**: $RELEASE_TITLE
          - **Release Page URL**: $RELEASE_URL
          - **APK Asset Filename**: \`app-debug.apk\`

          The APK can be downloaded directly from the **Assets** section of the release page linked above.
          The standard Actions artifact (\`app-debug-apk\`) is also available as a backup in this workflow run summary.
          EOF
          else
            echo "::warning::Release publishing failed or was skipped. The APK build and artifact upload succeeded!"
            echo "The APK build succeeded."
            echo "The Actions artifact named app-debug-apk remains available."

            cat << EOF >> "$GITHUB_STEP_SUMMARY"
          ### Warning: Release Publishing Encountered an Issue
          - **Status**: The APK build succeeded and the artifact was preserved.
          - **Actions Artifact**: \`app-debug-apk\` remains available for download.
          - **Backup Instructions**: You can download \`app-debug.apk\` directly from the **Artifacts** section at the top of this GitHub Actions run summary.
          EOF
          fi
